name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run python scripts/check_secrets.py --all
      - run: uv run ruff check .
      - run: uv run pytest
