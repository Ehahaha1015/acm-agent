[project]
name = "acm-agent"
version = "0.3.0"
description = "ACM Agent - a multilingual competitive programming coach with real execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "openai-agents>=0.0.15",
]

[project.scripts]
acm-agent = "acm_agent.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["acm_agent_tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_agent"]
