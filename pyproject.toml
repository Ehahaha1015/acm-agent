[project]
name = "acm-agent"
version = "0.1.0"
description = "ACM Agent - an AI competitive programming coach with real C++ execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "openai-agents>=0.0.15",
]

[project.scripts]
acm-agent = "acm_agent.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests", "acm_agent_tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["compiler", "app.py", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_agent"]
